# smartdns — локальный умный резолвер
#
# Смысл: для каждого имени задана ЦЕПОЧКА серверов.
# Спрашиваем первый. Если он «погадил» — молча идём ко второму, потом к третьему.
# Первый, чей ответ нормальный, и есть ответ клиенту.
#
# Запуск:
#   ./smartdns -config smartdns.yaml          (macOS/Linux, порт 53 → нужен sudo)
#   ./smartdns -check                          показать, как конфиг понят, и выйти
#   smartdns.exe -service install              Windows: поставить службой
#
# После правки конфига: kill -HUP <pid> — перечитает на ходу (кэш сбросится).

listen: 127.0.0.1:53

# false — IPv6 вырезаем: на AAAA отвечаем пустым NOERROR,
# из чужих ответов выкидываем AAAA и ipv6hint (RFC 9460), чтобы браузер
# не узнал IPv6-адрес даже через HTTPS-запись.
ipv6: false

# сколько ждать каждый сервер в цепочке
timeout: 4s

# пусто — писать в консоль
log: ""

# подробный лог: видно всю цепочку и причину отбраковки
verbose: true

# что считаем «погадил»
reject:
  # адреса из этих сетей в ответе = мусор
  networks:
    - 0.0.0.0/8        # классическая заглушка, в т.ч. 0.0.0.1
    - "::/128"         # :: — то же самое для IPv6
    - 127.0.0.0/8      # некоторые резолверы так «блокируют»
  # NOERROR без единой A-записи — тоже мусор
  empty_a: true
  # коды, на которых идём дальше по цепочке.
  # Добавьте NXDOMAIN, если ваш резолвер врёт «имени нет».
  rcodes: [SERVFAIL, REFUSED, NOTIMP]

cache:
  enabled: true
  max_entries: 10000     # записей; при переполнении вытесняются самые давние
  min_ttl: 10            # ниже этого не кэшируем дольше (секунды)
  max_ttl: 86400         # потолок (сутки)
  negative_ttl: 60       # сколько помнить пустые/NXDOMAIN ответы

# ---------------------------------------------------------------------------
# Серверы. Ключ — любое имя, оно же используется в цепочках ниже.
# Формат: IP, IP:порт, tls://IP|host (DoT, порт 853) или https://.../dns-query.
#
# bootstrap: куда ходить, чтобы резолвить ИМЕНА в адресах апстримов
# (tls://dns.quad9.net, https://xbox-dns.ru/dns-query). Только IP[:порт].
# Если наш сервер сам стоит системным резолвером — без бутстрапа имена
# апстримов не резолвятся никогда (петля). Апстримы по IP не требуют его.
# bootstrap: 9.9.9.9
# ---------------------------------------------------------------------------
servers:
  # «умный» резолвер: подменяет адреса AI-сервисов на рабочие.
  # Работает только если сам трафик идёт через Россию.
  ru:  111.88.96.50
  rudoh: https://xbox-dns.ru/dns-query

  # чистые — сюда уходим, когда умный погадил
  cf:  1.1.1.1
  g:   8.8.8.8
  quad9: 9.9.9.9

# ---------------------------------------------------------------------------
# Статические записи: то, что резолверу вообще не даём спрашивать.
# Значение: IP, домен (CNAME), nxdomain или refused. Можно через запятую.
# Ключ вида "*.domain" работает как суффикс — обычный hosts так не умеет.
# ---------------------------------------------------------------------------
hosts:
  # "*.doubleclick.net": nxdomain
  # "example.com": 93.184.216.34
  {}

# ---------------------------------------------------------------------------
# Цепочки. Первое подходящее правило выигрывает, поэтому частные правила
# пишем ВЫШЕ, а общее "match: [*]" — в самом низу.
# ---------------------------------------------------------------------------
routes:
  # Резолвер подменяет по суффиксу: совпадут и domain, и любые поддомены.
  - match:
      - openai.com
      - chatgpt.com
      - anthropic.com
      - claude.ai
      - cursor.com
      - notion.so
      - notion.com
    chain: [ru, cf, g]

  # Эти он знает только по точному имени — поддомены не подменяет.
  - match:
      - gemini.google.com
      - generativelanguage.googleapis.com
      - aistudio.google.com
      - ai.google.dev
      - copilot.microsoft.com
      - sydney.bing.com
      - elevenlabs.io
      - spotify.com
      - grok.com
      - sora.com
      - x.ai
      - perplexity.ai
      - midjourney.com
      - you.com
      - phind.com
      - suno.com
      - replicate.com
      - bolt.new
      - lovable.dev
    chain: [ru, cf, g]

  # Всё остальное — мимо него, сразу к чистым.
  - match: ["*"]
    chain: [cf, g]
